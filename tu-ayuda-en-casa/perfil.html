<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Ayuda en Casa | Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="assets/favicon.jpg">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="bi bi-house-door-fill me-1"></i> Tu Ayuda en Casa
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="contacto.html">Contacto</a></li>
                    <li class="nav-item ms-lg-3 d-flex align-items-center gap-2" id="contenedorAuthNav"></li>
                    <li class="nav-item ms-lg-2"><button id="btnModoOscuro" class="btn btn-outline-secondary btn-sm">🌙
                            Oscuro</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container contenido-principal my-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow border-0 rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">Configuración de Perfil</h3>
                        <p class="text-muted small">Actualiza tu foto y datos personales de acceso.</p>
                    </div>

                    <div class="d-flex flex-column align-items-center mb-4">
                        <div id="vistaPreviaContenedor" class="mb-3">
                        </div>
                        <label for="inputFotoPerfil" class="btn btn-outline-primary btn-sm fw-bold">Subir nueva
                            foto</label>
                        <input type="file" id="inputFotoPerfil" accept="image/*" class="d-none">
                        <small class="text-muted mt-2">Formatos aceptados: JPG, PNG.</small>
                    </div>

                    <form id="formEditarPerfil">
                        <div class="mb-3">
                            <label for="editNombre" class="form-label fw-bold">Nombre Completo</label>
                            <input type="text" class="form-control" id="editNombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="editCedula" class="form-label fw-bold">Número de Cédula</label>
                            <input type="text" class="form-control" id="editCedula" required maxlength="10"
                                autocomplete="off" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>
                        <div class="mb-4">
                            <label for="editPassword" class="form-label fw-bold">Nueva Contraseña</label>
                            <input type="password" class="form-control" id="editPassword" required
                                placeholder="Introduce tu contraseña o una nueva">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Guardar Cambios</button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
